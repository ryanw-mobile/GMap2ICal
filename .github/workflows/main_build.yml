name: Gradle Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# This workflow builds untrusted contributor code, so it must never be granted
# access to repository secrets. Coverage upload to Codacy (which needs a secret)
# is handled by the coverage_report.yml workflow_run extension instead.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '17'
          cache: gradle

      - name: Copy ConfigProvider for CI
        run: cp composeApp/src/commonTest/kotlin/uk/ryanwong/gmap2ics/app/configs/ProvideConfig.kt composeApp/src/commonMain/kotlin/uk/ryanwong/gmap2ics/app/configs/ProvideConfig.kt

      - name: Install Xvfb
        run: sudo apt-get install -y xvfb

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Gradle build
        run: xvfb-run ./gradlew build jacocoTestReport

      # Only the report itself is handed over. The commit it belongs to is NOT
      # passed through the artifact: this job runs contributor code, so anything
      # it produces is attacker-controlled. Coverage Report reads the commit from
      # the workflow_run event payload instead.
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage
          path: composeApp/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          retention-days: 1
          if-no-files-found: error
