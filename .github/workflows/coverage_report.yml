name: Coverage Report

# Extension of the "Gradle Build" workflow.
#
# Gradle Build compiles and tests contributor code, including code from forked
# pull requests, so it runs without access to repository secrets. This workflow
# picks up the coverage artifact it produced and performs the one step that does
# need a secret: uploading coverage to Codacy.
#
# workflow_run always executes the copy of this file on the default branch, in
# the context of this repository, so CODACY_PROJECT_TOKEN is never exposed to
# code originating from a fork.
#
# Results of a workflow_run workflow are not attached to the pull request that
# triggered it, so this workflow posts its own commit status against the pull
# request HEAD commit. That status is what makes coverage upload a blocking
# quality gate: add COVERAGE_STATUS_CONTEXT below to the required status checks
# for main.
on:
  workflow_run:
    workflows: [ "Gradle Build" ]
    types:
      - completed

permissions:
  contents: read
  actions: read
  statuses: write

env:
  # Must match the required status check configured on main.
  COVERAGE_STATUS_CONTEXT: coverage-report
  COVERAGE_REPORT: composeApp/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
  # Taken from the event payload, which is generated by GitHub and cannot be
  # influenced by the code that was built. For a run triggered by a pull request
  # this is the pull request HEAD commit, which is both what Codacy needs to
  # associate the coverage and what the status must be posted against. It must
  # never be sourced from the build artifact: a malicious pull request could then
  # name any commit and publish a passing status onto somebody else's branch.
  COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  codacy:
    runs-on: ubuntu-latest

    steps:
      - name: Download coverage report
        if: github.event.workflow_run.conclusion == 'success'
        uses: actions/download-artifact@v8
        with:
          name: jacoco-coverage
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # Guards against a build that reported success while producing an empty
      # report, which would otherwise upload as zero coverage.
      - name: Verify coverage report is present
        if: github.event.workflow_run.conclusion == 'success'
        run: |
          set -euo pipefail
          if [[ ! -s "$COVERAGE_REPORT" ]]; then
            echo "Gradle Build succeeded but produced no coverage report at $COVERAGE_REPORT." >&2
            exit 1
          fi

      # Invokes the Codacy reporter CLI directly rather than
      # codacy/codacy-coverage-reporter-action, because the action exposes no
      # commit-uuid input. On a workflow_run event GITHUB_SHA points at the
      # default branch head, so the commit must be passed explicitly.
      #
      # The report contents come from contributor code and are trusted only as
      # far as Codacy's own parser; the token is passed by environment so that it
      # cannot appear in the command line or the run log.
      - name: Run codacy-coverage-reporter
        id: codacy
        if: github.event.workflow_run.conclusion == 'success'
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          set -euo pipefail
          bash <(curl -Ls https://coverage.codacy.com/get.sh) report \
            --commit-uuid "$COMMIT_SHA" \
            -r "$COVERAGE_REPORT" \
            --partial
          bash <(curl -Ls https://coverage.codacy.com/get.sh) final \
            --commit-uuid "$COMMIT_SHA"

      # Posts the gate result onto the pull request HEAD commit. Runs even when
      # an earlier step failed, so a broken upload reports failure rather than
      # leaving the required check waiting forever.
      - name: Publish coverage gate status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.codacy.outcome == 'success' && 'success' || 'failure' }}
          DESCRIPTION: ${{ steps.codacy.outcome == 'success' && 'Coverage uploaded to Codacy' || 'Coverage was not uploaded to Codacy' }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${{ github.repository }}/statuses/$COMMIT_SHA" \
            -f state="$STATE" \
            -f context="$COVERAGE_STATUS_CONTEXT" \
            -f description="$DESCRIPTION" \
            -f target_url="$TARGET_URL"
